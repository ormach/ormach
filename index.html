    <meta name="twitter:description" content="Illustration and design for games.">

    <!-- Descriptions -->
    <meta property="og:description" content="Illustration and design for games." />
    <meta name="description" content="Illustration and design for games.">

    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/main.css">

    <!-- Mono-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" sizes="32x32"      href="../favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16"      href="../favicon/favicon-16x16.png">
    <link rel="manifest"                                 href="../favicon/manifest.json">
    <link rel="mask-icon"                                href="../favicon/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
</head>

<body>
    
    <!-- NAVIGATION -->
    <nav id="desktop-nav"></nav>
    <nav id="mobile-nav" class=""></nav>

    <div class="wrapper breakpoints">
        
        <!-- Modal -->
        <div id="modal" class="hide" onclick="modal()">
            <div class="container">

                <button  class="close btn ico">
                    <img src="../img/ico/close.svg" alt="">
                </button>

                <!-- <button onclick="next()" class="next btn ico">
                    <img src="../img/ico/arrow.svg" alt="">
                </button> -->

                <!-- <button class="next btn ico">
                    <img src="../img/ico/black/arrow.svg" alt="">
                </button> -->

                <img id="modal-img" src="../img/work/mech-920x600.png" alt="Vector illustration of a mech.">

            </div>
        </div>

        <!-- CONTENT -->
        <!-- keep extra container for nav position -->
        <div id="gallery" class="content-area">
            
            <div class="img-frame" style="gap: 72px;">
                <img src="../img/work/esc-1280.jpg"
                        class=""
                        style="
                        max-width: 540px; width: 100%;
                        box-shadow: 0px 4px 8px rgba(0,0,0,0.14);
                    " 
                        alt="Illustration of two sci-fi characters in an urban environment.">
                
                <div class="card-group tabletLargeHide">
                    <div class="cardContainer" 
                            style="
                            background-image: url(../img/work/card-frame-jester.svg);
                            z-index: 3;
                            left: 8px;
                            top: 88px;
                        "
                    >
                        <img src="../img/work/jester.jpg" alt="Image of a card.">
                    </div>

                    <div class="cardContainer" 
                            style="
                            background-image: url(../img/work/card-frame-wizard.svg);
                            z-index: 3;
                            right: -8px;
                            bottom: 88px;
                        "
                    >
                        <img src="../img/work/wizard.jpg" alt="Image of a card.">
                    </div>

                    <p 
                        class="tabletLargeHide"
                        style="max-width: 360px; position: absolute; bottom: -12px; text-align: center; font-style: italic;"
                    >
                        Hi! I draw cards, assets, logos &amp all kinds of stuff for games.                        
                    </p>
                </div>
            </div>
            
            <!-- Nether -->
            <div class="img-frame">
                <img src="../img/work/env-3.jpg" 
                    class="tabletLargeHide"
                    style="width: 275px;" 
                    alt="Illustration.">
                
                <!-- <img src="../img/work/shrom.jpg" 
                    class="tabletLargeHide"
                    style="width: 100px; transform: translate(0px, -85px);" 
                    alt="Illustration."> -->

                <img src="../img/work/nether-1280.jpg" 
                    style="
                        max-width: 800px; width: 100%;
                        transform: rotate(0deg);" 
                    loading = "lazy"
                    alt="Illustration.">
            </div>

            <!-- Chains -->
            <div class="img-frame" style="gap: 48px;">
                <img src="../img/work/chains-800.jpg" 
                    style="max-width: 720px; width: 100%;" 
                    loading = "lazy"
                    alt="Illustration.">

                <img src="../img/work/axe.jpg" 
                    class="tabletLargeHide"
                    style="width: 75px; transform: rotate(-14deg) translate(-22px, 82px); z-index: -1;" 
                    alt="Illustration.">

                <img src="../img/work/chain-banner.jpg" 
                    class="tabletLargeHide"
                    style="width: 276px;" 
                    alt="Illustration.">
            </div>

            <!-- Scribe -->
            <div class="img-frame">
                <img src="../img/work/env-2.jpg" 
                    class="tabletLargeHide"
                    style="width: 275px;" 
                    alt="Illustration.">

                <img src="../img/work/char-1.jpg" 
                    class="tabletLargeHide"
                    style="width: 75px;" 
                    alt="Illustration.">

                <div 
                    style="
                        position: relative;
                        padding: 24px 44px 12px 44px;
                        background-color: rgb(48,49,60);
                        height: min-content;
                    "
                >

                    <img src="../img/work/scribe-logo-248.png" 
                        alt="Subpar scribe logotype." 
                        class="tabletLargeHide"
                        style="width: 248px;
                            position: absolute;
                            top: 0;
                            left: calc(50% - 124px);
                        ">
                    <img src="../img/work/scribe-800.jpg" 
                        style="max-width: 720px; width: 100%;" 
                        loading = "lazy" 
                        alt="Illustration.">
                </div>
                
            </div>

            <!-- Cards -->
            <div 
                class="img-frame tabletLargeHide" 
                style="flex-wrap: wrap; max-width: 860px;"
            >

                <div class="cardContainer" 
                    style="
                        background-image: url(../img/work/card-frame-wall.svg);
                    
                    ">
                    <img src="../img/work/wall.jpg" alt="Image of a card.">
                </div>

                <div class="cardContainer" 
                    style="
                        background-image: url(../img/work/card-frame-ghost.svg);
                        
                    ">
                    <img src="../img/work/ghost.jpg" alt="Image of a card.">
                </div>
                
                <div class="cardContainer" 
                    style="
                        background-image: url(../img/work/card-frame-wolf.svg);
                        
                    ">
                    <img src="../img/work/wolf.jpg" alt="Image of a card.">
                </div>

                <div class="cardContainer" 

                    style="
                        background-image: url(../img/work/card-frame-farm.svg);
                        
                    ">
                    <img src="../img/work/farm.jpg" alt="Image of a card.">
                </div>
                
                <div class="cardContainer" 
                    style="
                        background-image: url(../img/work/card-frame-bear.svg);
                        
                    ">
                    <img src="../img/work/bear.jpg" alt="Image of a card.">
                </div>
            </div>

            <!-- Sketches -->
            <div class="img-frame tabletLargeHide" 
                style="
                    
                    flex-direction: column;
                    gap: 100px;
                "
                
            >
                <p style="max-width: 400px; text-align: center;">
                    I do everything by hand, large illustrations take ~40 hours to complete.
                </p>

                <!-- <p>***</p> -->

                <div style="display: flex;">
                    <img src="../img/work/sketch-1.jpg" 
                            class="border"
                            style="width: 340px; transform: translate(77px, -32px); z-index: -1;" 
                            alt="Illustration.">
    
                    <img src="../img/work/sketch-2.jpg"
                            class="border"
                            style="width: 340px;" 
                            alt="Illustration.">
    
                    <img src="../img/work/sketch-3.jpg" 
                            class="border"
                            style="width: 340px; transform: translate(-77px, 32px);" 
                            alt="Illustration.">
                </div>

                <p style="transform: rotate(180deg);">***</p>
            </div>

            
            <!-- Characters -->
            <div class="img-frame">
                <img src="../img/work/chars.jpg" 
                style="
                    max-width: 800px; width: 100%;
                " 
                loading = "lazy"
                alt="Illustration of various characters.">
            </div>

            <!-- Items -->
            <div class="img-frame">
                <img src="../img/work/items.jpg" 
                style="
                    max-width: 1000px; width: 100%;
                " 
                loading = "lazy"
                alt="Illustration of various items.">
            </div>
        </div>
        
    </div>

    <footer id="footer" class="breakpoints"></footer>

    <script src="../main.js"></script>
    <script>
        generateNav();
        generateFooter();
    </script>

</body>
</html>
