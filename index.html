                    <img src="../img/ico/arrow.svg" alt="">

            </div>

        <div id="gallery" class="content-area">
            
            <div class="img-frame" style="gap: 72px;">
                <img src="../img/work/esc-1280.jpg"
                        class="border"
                        style="
                        max-width: 540px; width: 100%;
                        box-shadow: 0px 4px 8px rgba(0,0,0,0.14);
                    "

                <div class="card-group tabletLargeHide">
                    <div class="cardContainer" 
                            style="
                            background-image: url(../img/work/card-frame-1.svg);
                            transform: rotate(0deg);
                            z-index: 3;
                            top: 52px;
                            left: 8px;
                        "
                    >
                        <img src="../img/work/card-img-1.jpg" alt="Image of a card.">
                    </div>
                    <div class="cardContainer" 
                            style="
                            background-image: url(../img/work/card-frame-2.svg);
                            transform: rotate(0deg);

                    >

                    </div>
                    <div class="cardContainer" 
                            style="
                            background-image: url(../img/work/card-frame-3.svg);
                            transform: rotate(0deg);
                            z-index: 2;
                            top: 232px;
                            left: -28px;   
                            opacity: 0.5;  
                            "
                    >
                        <img src="../img/work/card-img-3.jpg" alt="Image of a card.">
                    </div>
                        <div class="cardContainer"

                            opacity: 0.8;
                            "
                    >
                        <img src="../img/work/card-img-4.jpg" alt="Image of a card.">
                    </div>

                    <p 
                        class="tabletLargeHide"
                        style="max-width: 360px; position: absolute; bottom: -12px; text-align: center; font-style: italic;"
                    >
                        Hi! I draw cards, assets, logos &amp all kinds of stuff for games.                        
                    </p>

                    height: 240px;

                            class="border"
                            style="width: 340px;" 
                            alt="Illustration.">

                "
